name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_tests:
        description: 'Include tests in the build'
        type: boolean
        default: false
      include_classic:
        description: 'Include Classic UI (Lite) build'
        type: boolean
        default: false
      sign_binaries:
        description: 'Sign binaries via SignPath (test-signing). Uncheck to use unsigned build output.'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write       # OIDC token for cosign keyless signing
  attestations: write   # GitHub native attestation

jobs:
  build:
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      has-classic: ${{ steps.check-classic.outputs.has_classic }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Sprint 1 D7 — Phase B compliance gate.
      # Fails the build if any hook callback regains a stateMutex_ acquisition
      # or if any migrated atomic field gets a plain assignment/read.
      # See tools/audit/check_hook_thread_no_mutex.sh + plan §B D7.
      - name: Audit hook-thread Rule #11.3 compliance
        shell: bash
        run: bash tools/audit/check_hook_thread_no_mutex.sh

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VKey
        run: cmake --build build --config Release --target VKeyApp

      - name: Build TSF DLL
        run: cmake --build build --config Release --target VKeyTSF

      - name: Build Watchdog
        run: cmake --build build --config Release --target VKeyWatchdog

      - name: Build tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        # VKeyTestRunnerTests is gitignored at repo level (.gitignore on
        # Main), so it's absent on fresh CI checkouts. CMakeLists.txt skips
        # add_subdirectory when the dir is missing — only build it if present.
        shell: bash
        run: |
          cmake --build build --config Release --target VKeyTests
          if [ -f tools/VKeyTestRunner/CMakeLists.txt ]; then
            cmake --build build --config Release --target VKeyTestRunnerTests
          fi

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      # --- Classic UI (Lite) build ---
      - name: Configure Classic UI
        if: github.event_name != 'workflow_dispatch' || inputs.include_classic
        run: cmake -B build-classic -G "Visual Studio 17 2022" -A x64 -DVKEY_LITE_MODE=ON

      - name: Build Classic UI
        if: github.event_name != 'workflow_dispatch' || inputs.include_classic
        run: cmake --build build-classic --config Release --target VKeyLite

      # --- Gather unsigned binaries ---
      - name: Gather unsigned binaries
        id: check-classic
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-binaries
          Copy-Item "build/Release/VKey.exe" "unsigned-binaries/" -Force
          Copy-Item "build/Release/VKeyTSF.dll" "unsigned-binaries/" -Force
          Copy-Item "build/Release/VKeyWatchdog.exe" "unsigned-binaries/" -Force
          # Bundled Sciter runtime ships unsigned from the vendor — route it through
          # SignPath so every binary in the release ZIP is Authenticode-signed.
          Copy-Item "extern/sciter/bin/sciter.dll" "unsigned-binaries/" -Force
          $hasClassic = "false"
          if (Test-Path "build-classic/Release/VKeyClassic.exe") {
            Copy-Item "build-classic/Release/VKeyClassic.exe" "unsigned-binaries/" -Force
            $hasClassic = "true"
          }
          echo "has_classic=$hasClassic" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned binaries for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: unsigned-binaries/
          retention-days: 7

  sign-and-release:
    needs: build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- SignPath Code Signing ---
      # Tag pushes always sign (release-signing). Manual runs sign with
      # test-signing only when the `sign_binaries` input is checked; otherwise
      # the unsigned build output is downloaded into signed-binaries/ instead so
      # the steps below are identical regardless of whether signing ran.
      - name: Submit signing request to SignPath
        id: signpath-sign
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign_binaries
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '8e66dee3-2c1d-407f-a391-0d0d3fd74913'
          project-slug: 'VKey'
          signing-policy-slug: "${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}"
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-binaries'

      - name: Use unsigned binaries (signing skipped)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.sign_binaries }}
        uses: actions/download-artifact@v4
        with:
          name: unsigned-binaries
          path: signed-binaries

      - name: Reconstruct release layout
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "signed-binaries/VKey.exe" "dist/" -Force
          Copy-Item "signed-binaries/VKeyTSF.dll" "dist/" -Force
          Copy-Item "signed-binaries/VKeyWatchdog.exe" "dist/" -Force
          Copy-Item "signed-binaries/sciter.dll" "dist/" -Force
          
          New-Item -ItemType Directory -Force -Path upload-payload
          Copy-Item "dist/*" "upload-payload/" -Force
          
          if ("${{ needs.build.outputs.has-classic }}" -eq "true") {
            New-Item -ItemType Directory -Force -Path dist-classic
            Copy-Item "signed-binaries/VKeyClassic.exe" "dist-classic/" -Force
            # VKeyTSF.dll is REQUIRED — RegisterTsf() does LoadLibrary("<exe-dir>\VKeyTSF.dll").
            # Without it the Classic build cannot register TSF even when run elevated (issue #199).
            Copy-Item "signed-binaries/VKeyTSF.dll" "dist-classic/" -Force
            Copy-Item "signed-binaries/VKeyWatchdog.exe" "dist-classic/" -Force

            Copy-Item "signed-binaries/VKeyClassic.exe" "upload-payload/" -Force
          }

      # --- Zip releases ---
      - name: Zip Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath VKey.zip

      - name: Zip Classic Release
        if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.has-classic == 'true'
        shell: powershell
        run: |
          Compress-Archive -Path "dist-classic/*" -DestinationPath VKeyClassic.zip

      # --- SHA-256 checksums ---
      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Generate SHA-256 sidecars used by VerifyDownloadedZip (SEC-001)
          # Format: "<hash>  <filename>" (GNU coreutils sha256sum compatible)
          $files = @("VKey.zip")
          if ("${{ needs.build.outputs.has-classic }}" -eq "true") {
            $files += "VKeyClassic.zip"
          }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          }

      # --- GitHub build provenance attestation ---
      - name: Attest VKey
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: VKey.zip

      - name: Attest VKey Classic
        if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.has-classic == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: VKeyClassic.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            VKey.zip
            VKey.zip.sha256
            VKeyClassic.zip
            VKeyClassic.zip.sha256
          fail_on_unmatched_files: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VKey-x64
          path: upload-payload/
